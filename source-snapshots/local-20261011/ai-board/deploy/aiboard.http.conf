# AI 大咖会议私董会 —— nginx 反代（HTTP 优先版，无需证书即可上线）
# 用法：复制到 /etc/nginx/conf.d/aiboard.conf，nginx -t && systemctl reload nginx
# 升级 HTTPS 见 deploy/nginx-meeting.conf（certbot 申请证书后切换）。

server {
    listen 80;
    server_name meeting.weispace.cloud 101.35.232.194;

    # 全部反代到 Node（Node 已内置静态托管 out/）
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API：关闭缓冲，避免 SSE 发言流被缓冲
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # WebSocket：实时转录上行
    location /ws/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
