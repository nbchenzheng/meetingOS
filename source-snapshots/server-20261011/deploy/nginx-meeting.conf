# AI 大咖会议私董会 —— nginx 反代 + HTTPS
# 用法：复制到 /etc/nginx/conf.d/meeting.conf，certbot 申请证书后 reload。

# HTTP → HTTPS 跳转 + 证书挑战
server {
    listen 80;
    server_name meeting.weispace.cloud;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name meeting.weispace.cloud;

    ssl_certificate     /etc/letsencrypt/live/meeting.weispace.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meeting.weispace.cloud/privkey.pem;

    # 全部反代到 Node（Node 已内置静态托管 out/）。
    # 若想让 nginx 直接托管静态资源，可改为 root /opt/aiboard/out; 仅反代 /api 与 /ws。
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API：关闭缓冲，避免 SSE 发言流被缓冲
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # WebSocket：实时转录上行
    location /ws/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
